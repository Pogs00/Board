<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f5f9;--panel:#fff;--ink:#17202e;--mute:#6b7689;--line:#e1e6ee;--accent:#2f5bea;--hover:#eef2fb;--side:#17202e;--sideink:#c9d2e3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--panel:#18202c;--ink:#e8edf6;--mute:#8d99ad;--line:#273244;--accent:#6c8cff;--hover:#1f2a3a;--side:#0a0e14;--sideink:#aeb9cf}}
:root[data-theme="dark"]{--bg:#0f141c;--panel:#18202c;--ink:#e8edf6;--mute:#8d99ad;--line:#273244;--accent:#6c8cff;--hover:#1f2a3a;--side:#0a0e14;--sideink:#aeb9cf}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 "Instrument Sans",system-ui,sans-serif}
#app{display:flex;height:100%}
#side{width:220px;background:var(--side);color:var(--sideink);padding:18px 12px;flex:none;display:flex;flex-direction:column;gap:4px;overflow:auto}
#side h1{font:700 20px "Bricolage Grotesque",sans-serif;color:#fff;margin:0 8px 14px}
.bd{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;border:0;background:none;color:inherit;font:inherit;text-align:left;width:100%}
.bd:hover{background:rgba(255,255,255,.07)}.bd.on{background:var(--accent);color:#fff}
.bd i{font-style:normal;opacity:.6;font-size:12px}
.ghost{border:1px dashed rgba(255,255,255,.25);margin-top:8px;color:var(--sideink)}
#wrap{flex:1;display:flex;flex-direction:column;min-width:0}
#head{padding:18px 24px 12px;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}
#title{font:700 26px "Bricolage Grotesque",sans-serif;border:0;background:none;color:var(--ink);padding:2px 6px;border-radius:6px;min-width:0;flex:1 1 220px}
#title:hover,#title:focus{background:var(--hover);outline:none}
.stats{color:var(--mute);width:100%;order:3}
.stats b{color:var(--ink)}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs button{border:0;background:none;color:var(--mute);padding:7px 14px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff}
#q{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;width:180px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:hover{filter:brightness(.96)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#main{flex:1;overflow:auto;padding:4px 24px 40px}
.grp{margin-bottom:26px;min-width:1156px}
.gh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.gh .tg{border:0;background:none;color:var(--gc);cursor:pointer;font-size:14px;padding:4px}
.gn{border:0;background:none;font:700 17px "Bricolage Grotesque",sans-serif;color:var(--gc);padding:2px 6px;border-radius:6px;width:240px;max-width:50%}
.gn:hover,.gn:focus{background:var(--hover);outline:none}
.cnt{color:var(--mute)}
.x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:6px}
.x:hover{background:var(--hover);color:#d6455d}
.tbl{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--gc);border-radius:8px}
.r{display:grid;grid-template-columns:26px minmax(200px,1fr) 150px 140px 120px 140px 140px 100px 64px 34px;align-items:center;border-bottom:1px solid var(--line)}
.r:last-child{border-bottom:0}
.r>*{min-width:0;border-right:1px solid var(--line);height:38px}
.r>*:last-child{border-right:0}
.th{color:var(--mute);font-weight:600;font-size:12.5px}
.th>*{display:flex;align-items:center;padding:0 10px;height:32px}
.r input:not([type=date]),.r input[type=date]{border:0;background:none;color:var(--ink);font:inherit;padding:0 10px;width:100%;height:100%}
.r input:hover{background:var(--hover)}
.ow{display:flex;align-items:center;gap:6px;padding-left:6px}
.av{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;flex:none}
.av.e{background:var(--line)}
.pill{border:0;color:#fff;font:600 13px "Instrument Sans",sans-serif;width:100%;height:100%;padding:0 10px;cursor:pointer;appearance:none;-webkit-appearance:none;text-align:center;border-radius:0}
.pill option{color:#000;background:#fff}
.late{color:#d6455d}
.add{padding:0 10px;color:var(--mute);height:36px;display:flex;align-items:center}
.add input{width:100%;border:0;background:none;color:var(--ink);font:inherit;height:100%}
.bar{display:flex;height:6px;border-radius:0 0 7px 0;overflow:hidden}
.bar span{display:block}
.empty{text-align:center;color:var(--mute);padding:60px 0}
.kb{display:flex;gap:14px;align-items:flex-start;min-width:900px}
.col{flex:1;background:var(--hover);border-radius:10px;padding:10px;min-height:200px}
.col.over{outline:2px dashed var(--accent)}
.col h3{margin:2px 4px 10px;display:flex;align-items:center;gap:8px;font:700 15px "Bricolage Grotesque",sans-serif}
.dot{width:10px;height:10px;border-radius:50%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:grab}
.card.drag{opacity:.4}
.card .m{display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--mute);font-size:12.5px}
.tag{color:#fff;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:600}
.dt{font:700 26px "Bricolage Grotesque",sans-serif;flex:1 1 220px;padding:2px 6px}
.kp{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:14px}
.k{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.k b{display:block;font:700 28px "Bricolage Grotesque",sans-serif}.k span{color:var(--mute);font-size:12.5px}
.dg{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.pn.w{grid-column:1/-1}.pn h3{margin:0 0 12px;font:700 15px "Bricolage Grotesque",sans-serif}
.hb{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;margin:7px 0}
.hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb b{text-align:right}
.ht{background:var(--hover);border-radius:4px;height:10px;overflow:hidden;display:flex}.ht i{display:block;height:100%}
.tw{overflow-x:auto}.dtb{width:100%;border-collapse:collapse}
.dtb th{text-align:left;color:var(--mute);font-weight:600;font-size:12.5px;padding:6px 8px;white-space:nowrap}
.dtb td{padding:8px;border-top:1px solid var(--line)}
.lnk{border:0;background:none;color:var(--accent);font:600 14px "Instrument Sans",sans-serif;cursor:pointer;padding:0;text-align:left}
.u{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.uh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--mute);font-size:12.5px;margin-bottom:4px;white-space:normal}.uh b{color:var(--ink)}
.upd{padding:0 10px;color:var(--mute);font-size:12.5px;white-space:nowrap;display:flex;align-items:center}
.un{width:100%;height:100%;border-radius:0;font-size:12.5px}
.r{position:relative}
.hd{border:0;background:none;color:var(--mute);cursor:grab;width:100%;height:100%;font-size:14px;letter-spacing:-2px;padding:0}.hd:hover{color:var(--ink)}.hd:active{cursor:grabbing}
.r.drag{opacity:.4}
.dtop::before,.dbot::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--accent);z-index:3}
.dtop::before{top:-2px}.dbot::after{bottom:-2px}
.tbl.dend{outline:2px dashed var(--accent)}
.gtool{display:flex;gap:10px;align-items:center;margin-bottom:10px;color:var(--mute)}
.gtool select,.sr input:not([type=color]),.sr select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 8px;font:inherit;min-width:0}
.gt{overflow:auto;max-height:calc(100vh - 210px);border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.gt-in{position:relative}.gr{display:flex;border-bottom:1px solid var(--line);height:36px}
.gl{width:260px;flex:none;position:sticky;left:0;z-index:3;background:var(--panel);border-right:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 10px;overflow:hidden;white-space:nowrap}
.gn2{overflow:hidden;text-overflow:ellipsis}
.gk{position:relative;flex:none;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px)}
.gg,.gg .gl{background:var(--hover)}.gg .gk{background-image:none}
.gh2{position:sticky;top:0;z-index:5;height:auto;background:var(--panel)}.gh2 .gl{z-index:6;align-items:flex-end;padding-bottom:6px;font-weight:600;color:var(--mute)}
.mh,.dh{display:flex;font-size:12px;color:var(--mute)}
.mh div{overflow:hidden;white-space:nowrap;padding:3px 6px;border-right:1px solid var(--line);font-weight:600}
.dh div{text-align:center;padding:3px 0;flex:none;white-space:nowrap}.dh .we{background:var(--hover)}.dh .td{color:#d6455d;font-weight:700}
.bar2{position:absolute;top:6px;height:24px;border-radius:6px;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;cursor:grab;touch-action:none;user-select:none;z-index:2;overflow:hidden;padding:0 8px}
.bar2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.bar2.dn{opacity:.55}.bar2.ov{box-shadow:0 0 0 2px #d6455d}
.bar2 i{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}.rl{left:0}.rr{right:0}
.gk.un{cursor:copy}.gk.un:hover::after{content:"Click to set a date";position:absolute;left:8px;top:9px;color:var(--mute);font-size:12px}
.tline{position:absolute;top:0;bottom:0;width:2px;background:#d6455d;opacity:.55;pointer-events:none;z-index:1}
.sr{display:grid;grid-template-columns:36px 1fr 130px 28px 28px 28px;gap:6px;align-items:center;margin-bottom:8px}
.sr input[type=color]{width:36px;height:32px;padding:0;border:1px solid var(--line);border-radius:8px;background:none}
.x:disabled{opacity:.3;cursor:default}
.fbar{order:2;width:100%;display:flex;flex-wrap:wrap;gap:8px}
.fbar select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 8px;font:inherit;max-width:170px}
.osel{border:0;background:none;color:var(--ink);font:inherit;padding:0 4px;width:100%;height:100%;min-width:0}.osel:hover{background:var(--hover)}
.soon{color:#b8741a;font-weight:600}
.u.auto{background:var(--hover);border-style:dashed;color:var(--mute)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);min-width:700px}
.cg>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.cw{padding:6px 8px;color:var(--mute);font-weight:600;font-size:12.5px}.cd{min-height:104px;padding:4px}.cd>span{font-size:12px;color:var(--mute)}
.cd.out{background:var(--hover);opacity:.6}.cd.tdy>span{color:#fff;background:#d6455d;border-radius:10px;padding:0 6px}
.ch{display:block;width:100%;border:0;border-radius:5px;color:#fff;font:600 12px "Instrument Sans",sans-serif;padding:2px 6px;margin-top:3px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ch.ov{box-shadow:0 0 0 2px #d6455d}.ch.sn{box-shadow:0 0 0 2px #e0a100}.more{font-size:11.5px;color:var(--mute);padding:2px 4px}
.dsel{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit}
@media (max-width:700px){#side{width:150px}#head{padding:14px}#main{padding:4px 12px 40px}}
</style>
</head>
<body>
<div id="app">
  <nav id="side"></nav>
  <div id="wrap"><div id="head"></div><div id="main"></div></div>
</div>
<script>window.onerror=function(m,src,l){var d=document.getElementById('err');if(!d){d=document.createElement('div');d.id='err';d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99;background:#b00020;color:#fff;padding:10px 14px;font:14px system-ui,sans-serif;white-space:pre-wrap';(document.body||document.documentElement).appendChild(d)}d.textContent='Page error: '+m+' (line '+l+'). If it mentions FIREBASE_CONFIG or a syntax problem, check firebase-config.js.'};</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const cfgOk=()=>typeof FIREBASE_CONFIG!=='undefined'&&!/PASTE/.test(FIREBASE_CONFIG.apiKey+FIREBASE_CONFIG.projectId);
/* ==================================================================== */
const DEF=[{n:'Not started',c:'#8a93a3',k:0},{n:'Working on it',c:'#e0a100',k:1},{n:'Stuck',c:'#d6455d',k:2},{n:'Done',c:'#1f9d6b',k:3}];
let SL=DEF,S=DEF.map(x=>x.n),SC=DEF.map(x=>x.c);
const kd=i=>(SL[i.status]||SL[0]||{k:0}).k;
const P=['Low','Medium','High','Critical'],PC=['#5b8def','#7c6bd6','#e07a2f','#c2275a'];
const GC=['#2f5bea','#1f9d6b','#c2275a','#e07a2f','#7c6bd6'];
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ini=n=>n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const now=()=>Date.now();
const D={boards:{},groups:{},items:{},updates:{},settings:{}};
let bulk=false,q='';
let st={active:null,view:'table',dash:false,gz:30},db=null,fold={},pending=false;
try{const p=JSON.parse(localStorage.getItem('boards-ui'));if(p){st.active=p.active;st.view=p.view||'table';st.dash=!!p.dash;st.gz=p.gz||30;fold=p.fold||{}}}catch(e){}
const save=()=>{try{localStorage.setItem('boards-ui',JSON.stringify({active:st.active,view:st.view,dash:st.dash,gz:st.gz,fold}))}catch(e){}};
const srt=a=>a.sort((x,y)=>(x.order||0)-(y.order||0));
const boards=()=>srt(Object.values(D.boards)).map(b=>({...b,groups:srt(Object.values(D.groups).filter(g=>g.boardId===b.id)).map(g=>({...g,collapsed:!!fold[g.id],items:srt(Object.values(D.items).filter(i=>i.groupId===g.id))}))}));
const live=()=>boards().filter(b=>!b.archived);
const B=()=>{const l=live();const b=l.find(x=>x.id===st.active)||l[0];if(b)st.active=b.id;return b};
function ask(msg,input){return new Promise(res=>{const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px';
 o.innerHTML=`<div style="background:var(--panel);color:var(--ink);border-radius:12px;padding:20px;width:min(360px,100%);box-shadow:0 10px 40px rgba(0,0,0,.3)"><div style="font-weight:600;margin-bottom:12px">${esc(msg)}</div>${input?'<input id="mi" maxlength="80" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit">':''}<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" data-m="0">Cancel</button><button class="btn pri" data-m="1">OK</button></div></div>`;
 document.body.appendChild(o);const i=o.querySelector('#mi');(i||o.querySelector('[data-m="1"]')).focus();
 const done=v=>{o.remove();res(v)},ok=()=>done(input?(i.value.trim()||null):true);
 o.onclick=e=>{const m=e.target.dataset&&e.target.dataset.m;if(m==='0'||e.target===o)done(null);else if(m==='1')ok()};
 o.onkeydown=e=>{if(e.key==='Enter')ok();if(e.key==='Escape')done(null)}})}
function toast(m,undo){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:8px;z-index:30;display:flex;align-items:center';document.body.appendChild(t)}
 t.textContent=m;if(undo){const b=document.createElement('button');b.textContent='Undo';b.className='btn';b.style.cssText='margin-left:12px;padding:2px 10px';b.onclick=()=>{undo();t.style.display='none'};t.appendChild(b)}
 t.style.display='flex';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',undo?7000:3500)}
function lsSave(){if(!db){try{localStorage.setItem('boards-local',JSON.stringify(D))}catch(e){}}}
function put(col,id,data,quiet){if(col==='items'&&!quiet)data={...data,updatedAt:now()};const isNew=!D[col][id];D[col][id]={...(D[col][id]||{}),...data,id};if(!bulk)renderAll();lsSave();
 if(db){const r=db.collection(col).doc(id);(isNew?r.set(D[col][id]):r.update(data)).catch(e=>toast('Could not save: '+(e.message||e.code)))}}
function del(col,id){delete D[col][id];lsSave();if(db)db.collection(col).doc(id).delete().catch(e=>toast('Could not delete: '+(e.message||e.code)))}
function delItem(id){Object.values(D.updates).filter(u=>u.itemId===id).forEach(u=>del('updates',u.id));del('items',id)}
function delGroup(id){Object.values(D.items).filter(i=>i.groupId===id).forEach(i=>delItem(i.id));del('groups',id)}
const newGroup=(bid,name,n)=>put('groups',uid(),{boardId:bid,name,color:GC[n%GC.length],order:now()});
const newItem=(g,name,status,pri)=>{const id=uid();put('items',id,{boardId:g.boardId,groupId:g.id,name,owner:'',status,priority:pri,due:'',order:now()});logAct(id,'Item created')};
const fs={owner:'',status:'',pri:'',flag:'',sort:''};
const soon=it=>it.due&&kd(it)!==3&&it.due>=today&&it.due<=dstr(dn(today)+3);
const sorters={due:(a,b)=>(a.due||'9')<(b.due||'9')?-1:1,pri:(a,b)=>b.priority-a.priority,status:(a,b)=>a.status-b.status,name:(a,b)=>a.name.localeCompare(b.name),upd:(a,b)=>(b.updatedAt||0)-(a.updatedAt||0)};
const match=it=>(!q||(it.name+' '+it.owner).toLowerCase().includes(q.toLowerCase()))&&(!fs.owner||(fs.owner==='__none'?!it.owner:it.owner===fs.owner))&&(fs.status===''||it.status===+fs.status)&&(fs.pri===''||it.priority===+fs.pri)&&(!fs.flag||(fs.flag==='late'?late(it):fs.flag==='soon'?soon(it):!it.due));
const today=new Date().toISOString().slice(0,10);
const late=it=>it.due&&it.due<today&&kd(it)!==3;
const fmt=d=>d?new Date(d+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';

let upId=null;
const fts=t=>t?new Date(t).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}):'No edits yet';
function rel(t){if(!t)return '—';const m=Math.round((Date.now()-t)/60000);if(m<1)return 'just now';if(m<60)return m+'m ago';const h=Math.round(m/60);if(h<24)return h+'h ago';const d=Math.round(h/24);return d<8?d+'d ago':new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'})}

 document.getElementById('head').innerHTML=`<div class="dt">Dashboard</div><div class="tabs"><button class="${st.dview==='cal'?'':'on'}" data-a="dview" data-v="ov">Overview</button><button class="${st.dview==='cal'?'on':''}" data-a="dview" data-v="cal">Calendar</button></div>${dsel()}<button class="btn" data-a="statuses">Edit statuses</button><button class="btn" data-a="team">Team</button><button class="btn" data-a="report">Report</button><div class="stats">All <b>${bs.length}</b> boards combined, updated live</div>`;
 if(st.dview==='cal'){document.getElementById('main').innerHTML=renderCal(true);return}
 const rows=bs.map(b=>{const it=b.groups.flatMap(g=>g.items).filter(fo),d=it.filter(i=>kd(i)===3).length,o=it.filter(late).length;
  return `<tr><td><button class="lnk" data-a="pick" data-id="${b.id}">${esc(b.name)}</button></td><td>${it.length}</td><td style="min-width:130px"><div class="ht"><i style="width:${pct(d,it.length)}%;background:${'#1f9d6b'}"></i></div></td><td>${pct(d,it.length)}%</td><td>${it.filter(i=>kd(i)===2).length}</td><td class="${o?'late':''}">${o}</td></tr>`}).join('');
 document.getElementById('main').innerHTML=`<div class="kp">${kp.map(k=>`<div class="k"><b class="${k[0]==='Overdue'&&ov?'late':''}">${k[1]}</b><span>${k[0]}</span></div>`).join('')}</div>
 <div class="dg">
 <div class="pn"><h3>Status</h3><div class="ht" style="height:16px;margin-bottom:10px">${sc.map((v,i)=>v?`<i style="width:${v/n*100}%;background:${SC[i]}" title="${S[i]}"></i>`:'').join('')}</div>${S.map((s,i)=>hb(s,sc[i],n,SC[i])).join('')}</div>
 <div class="pn"><h3>Priority</h3>${P.map((s,i)=>hb(s,pc[i],Math.max(...pc,1),PC[i])).join('')}</div>
 <div class="pn"><h3>Open work by owner <span class="cnt" style="font-weight:400">(red = overdue)</span></h3>${ol.length?ol.map(([k,v])=>hb(k,v.o,om,'var(--accent)',v.l)).join(''):'<span class="cnt">Nothing open.</span>'}</div>
 <div class="pn w"><h3>Boards</h3><div class="tw"><table class="dtb"><tr><th>Board</th><th>Items</th><th>Progress</th><th>Done</th><th>Stuck</th><th>Overdue</th></tr>${rows||'<tr><td colspan="6" class="cnt">No boards yet.</td></tr>'}</table></div></div>
 <div class="pn w"><h3>Needs attention</h3><div class="tw"><table class="dtb"><tr><th>Item</th><th>Board</th><th>Owner</th><th>Due</th><th>Flag</th></tr>${att.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.board)}</td><td>${esc(i.owner)||'—'}</td><td class="${late(i)?'late':''}">${fmt(i.due)||'—'}</td><td>${kd(i)===2?`<span class="tag" style="background:${'#d6455d'}">Stuck</span> `:''}${late(i)?'<span class="tag" style="background:#b8741a">Overdue</span>':''}</td></tr>`).join('')||'<tr><td colspan="5" class="cnt">All clear. Nothing stuck or overdue.</td></tr>'}</table></div></div>
 <div class="pn w"><h3>Recent activity</h3>${rec}</div>
 </div>`;
}
function renderAll(){renderSide();
 if(st.dash)renderDash();
 else if(!B()){document.getElementById('head').innerHTML='';document.getElementById('main').innerHTML='<div class="empty">No boards yet.<br><br><button class="btn pri" data-a="newboard">Create the first board</button> <button class="btn" data-a="import">Import backup</button></div>'}
 else{renderHead();renderMain()}save()}
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,b=B();
 const gid=()=>t.closest('[data-g]').dataset.g;
 if(a==='pick'){st.active=t.dataset.id;st.dash=false;q=''}
 else if(a==='dash')st.dash=true;
 else if(a==='statuses'){openStatuses();return}
 else if(a==='team'){openTeam();return}
 else if(a==='glogin'){gLogin();return}
 else if(a==='signout'){auth0.signOut().then(()=>location.reload());return}
 else if(a==='report'){openReport();return}
 else if(a==='import'){importBackup();return}
 else if(a==='fclear'){fs.owner=fs.status=fs.pri=fs.flag=''}
 else if(a==='cprev'||a==='cnext'){const[y,m]=(st.cal||today.slice(0,7)).split('-').map(Number);st.cal=new Date(Date.UTC(y,m-1+(a==='cnext'?1:-1),1)).toISOString().slice(0,7)}
 else if(a==='ctoday')st.cal=today.slice(0,7);
 else if(a==='dview')st.dview=t.dataset.v;
 else if(a==='gzoom'){const L=[30,14,5,2],cur=L.reduce((m,x,i)=>Math.abs(x-st.gz)<Math.abs(L[m]-st.gz)?i:m,0);st.gz=L[Math.min(L.length-1,Math.max(0,cur+(t.dataset.d==='in'?-1:1)))];window._gz=1}
 else if(a==='gfit'){const g=document.querySelector('.gt');if(g&&gDays){st.gz=Math.max(1.2,Math.min(40,Math.floor((g.clientWidth-290)/gDays*10)/10));window._gz=1}}
 else if(a==='unarch')put('boards',t.dataset.id,{archived:false});
 else if(a==='purge'){if(!await ask('Permanently delete this archived board and everything in it? This cannot be undone.'))return;const bd=boards().find(x=>x.id===t.dataset.id);if(bd){bd.groups.forEach(g=>delGroup(g.id));del('boards',bd.id)}}
 else if(a==='gtoday'){const g=document.querySelector('.gt');if(g)g.scrollLeft=Math.max(0,(dn(today)-gLo)*(st.gz||30)-120);return}
 else if(a==='upd'){openUpd(t.dataset.id);return}
 else if(a==='closeupd'){closeUpd();return}
 else if(a==='postupd'){postUpd();return}
 else if(a==='delupd'){del('updates',t.dataset.id);renderUpd();return}
 else if(a==='newboard'){const n=await ask('Board name',1);if(!n)return;const id=uid();st.active=id;st.dash=false;put('boards',id,{name:n,order:now()});newGroup(id,'To do',0)}
 else if(a==='delboard'){if(!await ask('Archive this board? It disappears for everyone but can be restored from the sidebar.'))return;put('boards',b.id,{archived:true,archivedAt:now()});st.active=null}
 else if(a==='view')st.view=t.dataset.v;
 else if(a==='addgroup'){const n=await ask('Group name',1);if(!n)return;newGroup(b.id,n,b.groups.length)}
 else if(a==='fold')fold[gid()]=!fold[gid()];
 else if(a==='delgroup'){const g=b.groups.find(x=>x.id===gid());if(g.items.length&&!await ask('Delete this group and its items?'))return;delGroup(g.id)}
 else if(a==='delitem')delItemUndo(t.dataset.id);
 else if(a==='kadd'){if(!b.groups.length)return toast('Add a group first');const n=await ask('Item name',1);if(!n)return;newItem(b.groups[0],n,+t.dataset.s,1)}
 else if(a==='backup'){dl('boards-backup-'+today+'.json',new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));return}
 renderAll();
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='title'){put('boards',B().id,{name:t.value||'Untitled'});return}
 if(t.dataset.f){const f=t.dataset.f;trk(t.closest('[data-id]').dataset.id,{[f]:(f==='status'||f==='priority')?+t.value:t.value});return}
 if(t.dataset.gf)put('groups',t.closest('[data-g]').dataset.g,{name:t.value});
});
document.addEventListener('keydown',e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.add&&e.key==='Enter'&&t.value.trim()){
  const gi=t.closest('[data-g]').dataset.g;newItem(D.groups[gi],t.value.trim(),0,1);
  const inp=document.querySelector(`[data-g="${gi}"] [data-add]`);inp&&inp.focus()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;renderMain()}});
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.card');if(c){dragId=c.dataset.id;c.classList.add('drag');e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragend',e=>{document.querySelectorAll('.drag,.over').forEach(x=>x.classList.remove('drag','over'))});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.col');if(c&&dragId){e.preventDefault();document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('.col');if(c&&dragId){e.preventDefault();trk(dragId,{status:+c.dataset.s});dragId=null}});
let rowDrag=null;
const orderBetween=(p,n)=>p&&n?(p.order+n.order)/2:p?p.order+1000:n?n.order-1000:now();
const gItems=(gid,skip)=>srt(Object.values(D.items).filter(i=>i.groupId===gid&&i.id!==skip));
function moveTo(id,gid,refId,after){const it=D.items[id],g=D.groups[gid];if(!it||!g)return;
 const sib=gItems(gid,id);let p,n;
 if(!refId)p=sib[sib.length-1];
 else{const k=sib.findIndex(i=>i.id===refId);if(k<0)return;if(after){p=sib[k];n=sib[k+1]}else{p=sib[k-1];n=sib[k]}}
 put('items',id,{groupId:gid,boardId:g.boardId,order:orderBetween(p,n)},true)}
function moveItem(id,dir){const it=D.items[id];if(!it)return;const sib=gItems(it.groupId),k=sib.findIndex(i=>i.id===id);
 if(dir<0&&k>0)moveTo(id,it.groupId,sib[k-1].id,false);else if(dir>0&&k<sib.length-1)moveTo(id,it.groupId,sib[k+1].id,true)}
const clearDrop=()=>document.querySelectorAll('.dtop,.dbot,.dend').forEach(x=>x.classList.remove('dtop','dbot','dend'));
document.addEventListener('dragstart',e=>{const h=e.target.closest&&e.target.closest('.hd');if(!h)return;const r=h.closest('.r');rowDrag=r.dataset.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',rowDrag);try{e.dataTransfer.setDragImage(r,20,16)}catch(x){}r.classList.add('drag')});
document.addEventListener('dragover',e=>{if(!rowDrag)return;const tb=e.target.closest&&e.target.closest('.tbl');if(!tb)return;e.preventDefault();clearDrop();const r=e.target.closest('.r[data-id]');
 if(r){const b=r.getBoundingClientRect();r.classList.add(e.clientY<b.top+b.height/2?'dtop':'dbot')}else if(!e.target.closest('.th'))tb.classList.add('dend')});
document.addEventListener('drop',e=>{if(!rowDrag)return;const tb=e.target.closest&&e.target.closest('.tbl');if(!tb)return;e.preventDefault();
 const gid=tb.closest('[data-g]').dataset.g,id=rowDrag,r=e.target.closest('.r[data-id]');let ref=null,after=false;
 if(r){ref=r.dataset.id;const b=r.getBoundingClientRect();after=e.clientY>=b.top+b.height/2;if(ref===id){rowDrag=null;clearDrop();return}}
 else if(e.target.closest('.th')){const f=gItems(gid,id)[0];ref=f?f.id:null}
 rowDrag=null;clearDrop();moveTo(id,gid,ref,after)});
document.addEventListener('dragend',()=>{rowDrag=null;clearDrop();document.querySelectorAll('.r.drag').forEach(x=>x.classList.remove('drag'))});
document.addEventListener('keydown',e=>{const t=e.target;if(!t.classList||!t.classList.contains('hd')||!/^Arrow(Up|Down)$/.test(e.key))return;e.preventDefault();
 const id=t.closest('.r').dataset.id;moveItem(id,e.key==='ArrowUp'?-1:1);setTimeout(()=>{const h=document.querySelector(`[data-id="${id}"] .hd`);h&&h.focus()},0)});
document.addEventListener('focusout',()=>{if(pending){pending=false;setTimeout(renderAll,0)}});
function later(){if(upId)renderUpd();const a=document.activeElement;
 if(a&&a.id==='q'){renderSide();renderMain()}
 else if(a&&/INPUT|SELECT/.test(a.tagName)&&document.hasFocus())pending=true;
 else renderAll()}
(async()=>{renderAll();
 if(!cfgOk()){gate('<p class="cnt">Almost there. Open <b>firebase-config.js</b> in your site files, replace the PASTE placeholders with your Firebase settings, and reload. SETUP.md has the steps.</p>');return}
 if(!window.firebase){gate('<p class="cnt">Could not load Firebase. Check your connection and reload.</p>');return}
 firebase.initializeApp(FIREBASE_CONFIG);auth0=firebase.auth();
 auth0.onAuthStateChanged(u=>{if(!u){gate('<p class="cnt">Sign in with your Google account to open the team boards.</p><button class="btn pri" data-a="glogin">Sign in with Google</button><div id="gerr" style="color:#d6455d;margin-top:12px"></div>');return}if(db)return;ungate();start(u)})})();
</script>
